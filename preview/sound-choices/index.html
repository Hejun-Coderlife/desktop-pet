<!doctype html><html lang="zh"><meta charset="utf-8"><title>Pip 声音试听</title>
<style>
body{margin:0;font-family:-apple-system,"PingFang SC",sans-serif;background:linear-gradient(160deg,#fff7f2,#f3f0ff);color:#3a3340;padding:40px 6vw}
h1{font-size:30px;margin:0 0 6px} .hint{color:#8a8090;margin:0 0 28px}
section{background:#fff;border-radius:22px;padding:20px 24px 24px;margin-bottom:18px;box-shadow:0 6px 24px rgba(120,90,140,.08)}
h2{margin:0;font-size:20px} section>p{margin:4px 0 14px;color:#9a90a0;font-size:14px}
.g{display:flex;flex-wrap:wrap;gap:10px}
button{border:0;background:#f6f1fb;border-radius:14px;padding:12px 16px;font-size:15px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.15s;color:inherit}
button:hover{background:#efe4fa;transform:translateY(-1px)} button.on{background:#ffd9e4}
button b{background:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:13px;color:#b0639a}
.src{color:#a8a0ad;font-size:12px;margin-top:26px;line-height:1.7}
</style>
<h1>Pip 声音试听</h1><p class="hint">点按钮就能听。每个动作挑一个，告诉我编号就行（比如「拎起 3、摸头 15……」）。</p>
<section><h2>被拎起来</h2><p>抓住它往上拎的一瞬间</p><div class="g"><button onclick="p('cute_01',this)"><b>1</b><span>小生物 A</span></button><button onclick="p('cute_02',this)"><b>2</b><span>小生物 B</span></button><button onclick="p('cute_03',this)"><b>3</b><span>小生物 C</span></button><button onclick="p('cute_04',this)"><b>4</b><span>小生物 D</span></button><button onclick="p('cute_05',this)"><b>5</b><span>小生物 E</span></button><button onclick="p('cute_08',this)"><b>6</b><span>小生物 F</span></button><button onclick="p('cute_10',this)"><b>7</b><span>小生物 G</span></button><button onclick="p('squeak_1',this)"><b>8</b><span>捏响玩具</span></button></div></section><section><h2>被点一下</h2><p>点它，它吓一跳蹦一下</p><div class="g"><button onclick="p('giggle_1',this)"><b>9</b><span>咯咯笑 A</span></button><button onclick="p('giggle_2',this)"><b>10</b><span>咯咯笑 B</span></button><button onclick="p('giggle_3',this)"><b>11</b><span>咯咯笑 C</span></button><button onclick="p('cute_07',this)"><b>12</b><span>短促一声</span></button><button onclick="p('misc_06',this)"><b>13</b><span>咦？</span></button><button onclick="p('cute_06',this)"><b>14</b><span>小生物 H</span></button></div></section><section><h2>被摸头</h2><p>鼠标在它头上来回划</p><div class="g"><button onclick="p('purr_1',this)"><b>15</b><span>猫呼噜 A</span></button><button onclick="p('purr_2',this)"><b>16</b><span>猫呼噜 B</span></button><button onclick="p('purr_3',this)"><b>17</b><span>猫呼噜 C</span></button><button onclick="p('purr_4',this)"><b>18</b><span>猫呼噜 D</span></button><button onclick="p('cute_09',this)"><b>19</b><span>满足地哼</span></button></div></section><section><h2>落地</h2><p>扔出去后落地</p><div class="g"><button onclick="p('squeak_2',this)"><b>20</b><span>软软吱一声</span></button><button onclick="p('misc_04',this)"><b>21</b><span>噗</span></button><button onclick="p('misc_01',this)"><b>22</b><span>嘿咻</span></button><button onclick="p('ooh',this)"><b>23</b><span>哦~</span></button></div></section><section><h2>睡醒 / 打哈欠</h2><p>长时间没碰电脑睡着，回来时醒</p><div class="g"><button onclick="p('yawn_dog',this)"><b>24</b><span>小狗打哈欠</span></button><button onclick="p('breath',this)"><b>25</b><span>呼气</span></button><button onclick="p('snore',this)"><b>26</b><span>小呼噜</span></button><button onclick="p('misc_09',this)"><b>27</b><span>伸懒腰</span></button></div></section><section><h2>举牌提醒</h2><p>定时举牌提醒喝水</p><div class="g"><button onclick="p('jingle_1',this)"><b>28</b><span>清脆提示音</span></button><button onclick="p('meow_short1',this)"><b>29</b><span>小猫喵 A</span></button><button onclick="p('meow_short2',this)"><b>30</b><span>小猫喵 B</span></button><button onclick="p('meow_3',this)"><b>31</b><span>小猫喵 C</span></button><button onclick="p('meow_4',this)"><b>32</b><span>小猫喵 D</span></button><button onclick="p('misc_08',this)"><b>33</b><span>嗯？</span></button></div></section>
<p class="src">来源：全部是 CC0（可免费商用、放进软件分发）的真实录音——OpenGameArt「80 CC0 creature SFX」、Freesound 上 CC0 授权的猫叫/猫呼噜/笑声/玩具声。已统一裁短、统一音量。</p>
<script>let a;function p(f,b){if(a)a.pause();a=new Audio(f+".mp3");a.play();document.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on")}</script></html>
