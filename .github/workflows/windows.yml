# Windows 版：编译 Pip.exe → 在 runner 上真机自检（状态机、离屏渲染、真窗口截屏、模拟鼠标拎起来扔、站到记事本窗口上）
# runner 没有显卡，自检时把 Mesa 的软件 OpenGL（llvmpipe）放在 exe 旁边；发给用户的 Pip.exe 用电脑自己的显卡驱动
# 发新版：推一个 v1.2.3 标签（git tag v1.2.3 && git push origin v1.2.3）→ 按这个版本号编译、自检、出安装包，
# 发成 GitHub Release；Pip 的自动更新就看 releases/latest（Updater.cs）
name: Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths: ["windows/**", ".github/workflows/windows.yml"]   # 只管分支；推标签不看 paths，总会跑
  workflow_dispatch:

permissions:
  contents: write   # 发 Release 用

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          # 标签 v1.2.3 → 1.2.3；平常的推送用 csproj / Pip.iss 里写的版本
          $v = if ("${{ github.ref }}" -match '^refs/tags/v(\d+\.\d+\.\d+)$') { $matches[1] } else { '' }
          "PIP_VERSION=$v" >> $env:GITHUB_ENV
          Write-Host "version: '$v'"

      - name: Build
        run: |
          if ($env:PIP_VERSION) { dotnet build windows/Pip.csproj -c Release -p:Version=$env:PIP_VERSION } else { dotnet build windows/Pip.csproj -c Release }

      - name: Mesa (software OpenGL for the self-test only)
        run: |
          $rel = Invoke-RestMethod "https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest" -Headers @{ Authorization = "Bearer ${{ github.token }}" }
          New-Item -ItemType Directory -Force test | Out-Null
          Copy-Item windows/bin/Release/net48/Pip.exe test/
          # 新版 msvc 包的 x64/ 里不一定有 opengl32.dll，按 msvc → mingw 顺序找，找到哪个目录就整目录拷过去
          $gl = $null
          foreach ($kind in @("msvc", "mingw")) {
            $asset = $rel.assets | Where-Object { $_.name -match "^mesa3d-.*-release-$kind\.7z$" } | Select-Object -First 1
            if (-not $asset) { continue }
            Write-Host "mesa: $($asset.name)"
            Invoke-WebRequest $asset.browser_download_url -OutFile "mesa-$kind.7z"
            7z x "mesa-$kind.7z" "-omesa-$kind" | Out-Null
            $gl = Get-ChildItem "mesa-$kind" -Recurse -Filter opengl32.dll | Where-Object { $_.DirectoryName -match 'x64' } | Select-Object -First 1
            if ($gl) { break }
            Get-ChildItem "mesa-$kind" -Recurse -Filter *.dll | ForEach-Object { $_.FullName } | Select-Object -First 40
          }
          if (-not $gl) { throw "mesa 包里没找到 x64 的 opengl32.dll" }
          Write-Host "opengl32: $($gl.FullName)"
          Copy-Item "$($gl.DirectoryName)/*.dll" test/
          Get-ChildItem test | Format-Table Name, Length

      - name: Self-test
        run: |
          $env:GALLIUM_DRIVER = "llvmpipe"
          $p = Start-Process -FilePath test/Pip.exe -ArgumentList "--selftest", "$PWD/selftest" -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Host "self-test timed out" }
          if (Test-Path selftest/report.txt) { Get-Content selftest/report.txt -Encoding UTF8 } else { Write-Host "no report" }
          Write-Host "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Upload self-test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest
          path: selftest

      - name: Upload Pip.exe
        uses: actions/upload-artifact@v4
        with:
          name: Pip-Windows-x64
          path: windows/bin/Release/net48/Pip.exe

      # 安装包（Inno Setup 6，免费）：runner 上没有就用 choco 装
      - name: Installer
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if ($env:PIP_VERSION) { & $iscc /Q "/DAppVersion=$env:PIP_VERSION" windows/installer/Pip.iss } else { & $iscc /Q windows/installer/Pip.iss }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # Pip 自动更新先下这个校验文件再下安装包（Updater.cs）
          foreach ($f in Get-ChildItem dist/Pip-Setup-*.exe) { "$((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower())  $($f.Name)" | Set-Content -NoNewline -Encoding ascii "$($f.FullName).sha256" }
          Get-ChildItem dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Pip-Setup-Windows-x64
          path: dist/Pip-Setup-*

      # 只有推 v* 标签才发 Release（说明 = 自上个版本以来的提交）
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem dist/Pip-Setup-*).FullName --title "Pip ${{ github.ref_name }}" --generate-notes
